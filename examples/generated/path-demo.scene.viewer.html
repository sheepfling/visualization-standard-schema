<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VSS Path Demo Scene Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
      html, body, #cesiumContainer {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 1;
        max-width: 24rem;
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.82);
        color: #e2e8f0;
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }
      .overlay h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .overlay p {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
      }
      .overlay code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <h1>VSS Path Demo Scene Viewer</h1>
      <p>Load this page through a local web server so Cesium can fetch <code>./path-demo.scene.czml.json</code>.</p>
    </div>
    <div id="cesiumContainer"></div>
    <script>
      const viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        shouldAnimate: false
      });

      Cesium.CzmlDataSource.load("./path-demo.scene.czml.json")
        .then((dataSource) => viewer.dataSources.add(dataSource))
        .then((dataSource) => viewer.zoomTo(dataSource))
        .catch((error) => {
          console.error("Failed to load CZML", error);
        });
    </script>
  </body>
</html>
